
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23C084FC&color_dots=%230D1117,%232E1065,%234C1D95,%237C3AED,%23C4B5FD
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23C084FC&color_dots=%230D1117,%232E1065,%234C1D95,%237C3AED,%23C4B5FD

      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
